[project]
name = "rag-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vincent-CLY", email = "vchku413@connect.hku.hk" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "langchain>=1.4.2",
    "langchain-docling>=3.0.0",
    "langchain-openai>=1.6.4",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "python-dotenv>=1.2.3",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.19.1",
    # --- V2/V3 roadmap dependencies (declared ahead of implementation) ---
    "docling>=2.5.0",                    # V1: standalone layout-aware parser
    "llama-index-core>=0.12.0",          # V2: sentence-window / parent-child retrieval
    "llama-index-readers-docling>=0.3.0",
    "llama-index-vector-stores-qdrant>=0.4.0",
    "langgraph>=0.2.60",                 # V3: agentic state-machine orchestration
    "flashrank>=0.2.0",                  # V2: lightweight cross-encoder reranker
    "ragas>=0.2.0",                      # production: RAG evaluation harness
    "faster-whisper>=1.0.0",             # V2: local audio/video transcription
    "fastembed>=0.9.0",
]

[project.scripts]
rag-backend = "rag_backend:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
